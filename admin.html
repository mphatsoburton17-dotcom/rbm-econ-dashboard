<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Malawi Economic Indicators</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div class="admin-box" id="loginBox">
    <h3>Admin Login</h3>
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter admin password">
    <button onclick="login()">Log in</button>
    <div id="loginMsg"></div>
  </div>

  <!-- ADD ENTRY FORM (hidden until logged in) -->
  <div class="admin-box" id="entryBox" style="display:none;">
    <h3>Add / Update This Month's Data</h3>
    <label>Month (e.g. 2026-08)</label>
    <input type="text" id="fMonth" placeholder="2026-08">
    <label>Label (e.g. Aug 2026)</label>
    <input type="text" id="fLabel" placeholder="Aug 2026">
    <label>Headline Inflation (%)</label>
    <input type="number" step="0.1" id="fHeadline">
    <label>Food Inflation (%) — leave blank if unknown</label>
    <input type="number" step="0.1" id="fFood">
    <label>Non-Food Inflation (%) — leave blank if unknown</label>
    <input type="number" step="0.1" id="fNonFood">
    <label>Source (e.g. RBM/NSO CPI Release, Aug 2026)</label>
    <input type="text" id="fSource">
    <button onclick="saveEntry()">Save this month's entry</button>
    <div id="entryMsg"></div>
  </div>

</div>
<script>
  let adminPassword = '';

  async function login() {
    const password = document.getElementById('loginPassword').value;
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    const msg = document.getElementById('loginMsg');
    if (data.ok) {
      adminPassword = password;
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('entryBox').style.display = 'block';
    } else {
      msg.innerHTML = '<div class="admin-msg err">Incorrect password.</div>';
    }
  }

  async function saveEntry() {
    const body = {
      month: document.getElementById('fMonth').value,
      label: document.getElementById('fLabel').value,
      headline: parseFloat(document.getElementById('fHeadline').value),
      food: document.getElementById('fFood').value ? parseFloat(document.getElementById('fFood').value) : null,
      nonFood: document.getElementById('fNonFood').value ? parseFloat(document.getElementById('fNonFood').value) : null,
      source: document.getElementById('fSource').value
    };

    const res = await fetch('/api/admin/entries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const msg = document.getElementById('entryMsg');
    if (data.ok) {
      msg.innerHTML = '<div class="admin-msg ok">Saved. The public dashboard now shows this month\'s data.</div>';
    } else {
      msg.innerHTML = `<div class="admin-msg err">${data.error || 'Something went wrong.'}</div>`;
    }
  }
</script>
</body>
</html>
